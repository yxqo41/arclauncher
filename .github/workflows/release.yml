name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for GitHub Release (e.g. 1.0.11). Leave empty to use auto-version."
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  RELEASE_APK_FILENAME_PREFIX: arclauncher
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup signing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_JKS_FILE_BASE64: ${{ secrets.SIGNING_JKS_FILE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ ! -f "android/app/google-services.json" ]; then
            # Dummy google-services.json if missing to satisfy gradle plugin if required
            echo '{"project_info":{"project_number":"123456789","project_id":"arc-launcher"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.omeda.arc"}}}]}' > android/app/google-services.json
          fi

          if [ -n "$SIGNING_JKS_FILE_BASE64" ]; then
            echo -n "$SIGNING_JKS_FILE_BASE64" | base64 -d > android/app/upload-keystore.jks
          else
            echo "Generating fallback signing keystore for fork build..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set build metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v1.0.10-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build_name=${TAG}" >> "$GITHUB_OUTPUT"

          # versionCode from pubspec.yaml (e.g. 1.0.6+4115 -> 4115)
          BUILD_NUMBER=$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' pubspec.yaml)
          BUILD_NUMBER=${BUILD_NUMBER:-4116}
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build release APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || 'android' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'android' }}
        run: |
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-number=${{ steps.meta.outputs.build_number }} \
            --build-name=${{ steps.meta.outputs.build_name }}

          mkdir -p release-apks
          find build/app/outputs -name 'arc-launcher-universal-release.apk' -exec cp -t release-apks/ {} +
          find build/app/outputs -name 'arc-launcher-arm64-v8a-release.apk' -exec cp -t release-apks/ {} +
          find build/app/outputs -name 'arc-launcher-armeabi-v7a-release.apk' -exec cp -t release-apks/ {} +

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: release-apks/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  github-release:
    needs: [build-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: release-apks

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v1.0.10-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p dist
          if [ -f "release-apks/arc-launcher-universal-release.apk" ]; then
            cp release-apks/arc-launcher-universal-release.apk "dist/${RELEASE_APK_FILENAME_PREFIX}-${TAG}.apk"
            cp release-apks/arc-launcher-universal-release.apk "dist/${RELEASE_APK_FILENAME_PREFIX}.apk"
          fi
          if [ -f "release-apks/arc-launcher-arm64-v8a-release.apk" ]; then
            cp release-apks/arc-launcher-arm64-v8a-release.apk "dist/${RELEASE_APK_FILENAME_PREFIX}-${TAG}-arm64-v8a.apk"
          fi
          if [ -f "release-apks/arc-launcher-armeabi-v7a-release.apk" ]; then
            cp release-apks/arc-launcher-armeabi-v7a-release.apk "dist/${RELEASE_APK_FILENAME_PREFIX}-${TAG}-armeabi-v7a.apk"
          fi
          echo "### Arc Launcher Build (${TAG})" > release_notes.md
          echo "Automated APK build from fork commit ${{ github.sha }}." >> release_notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Arc Launcher ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: false
